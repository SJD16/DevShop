apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devshop-eks
  region: us-east-1
  version: "1.36"
  
vpc:
  id: vpc-0847da6677b21ff4b
  subnets:
    public:
      us-east-1a:
        id: subnet-00f106f3b530dbae9
      us-east-1b:
        id: subnet-0dd039aa69fa179c0

managedNodeGroups:
  - name: devshop-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    volumeType: gp3

    labels:
      workload: devshop

    privateNetworking: false
    tags:
      Project: DevShop
      Environment: dev
      ManagedBy: eksctl
