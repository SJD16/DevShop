apiVersion: apps/v1
kind: Deployment
metadata:
  name: devshop
  namespace: devshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devshop
  template:
    metadata:
      labels:
        app: devshop
    spec:
      containers:
      - name: devshop
          image: sjd16/devshop:3
          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devshop-config
                  key: DATABASE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devshop-secret
                  key: JWT_SECRET_KEY

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: devshop
  namespace: devshop
spec:
  type: NodePort
  selector:
    app: devshop
  ports:
    - port: 8000
      targetPort: 8000