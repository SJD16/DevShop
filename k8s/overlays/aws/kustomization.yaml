apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devshop

resources:
  - ../../base
  - postgres-storageclass.yaml

patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: devshop-postgres-data
      namespace: devshop
    path: postgres-pvc-patch.yaml

images:
  - name: sjd16/devshop
    newName: sjd16/devshop
    newTag: ed67175
