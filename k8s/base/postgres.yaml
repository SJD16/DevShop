apiVersion: apps/v1
kind: Deployment
metadata:
  name: devshop-postgres
  namespace: devshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devshop-postgres
  template:
    metadata:
      labels:
        app: devshop-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: devshop
            - name: POSTGRES_PASSWORD
              value: devshop_dev_password
            - name: POSTGRES_DB
              value: devshop_test
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devshop
                - -d
                - devshop_test
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devshop-postgres
  namespace: devshop
spec:
  selector:
    app: devshop-postgres
  ports:
    - port: 5432
      targetPort: 5432