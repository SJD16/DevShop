apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: devshop-secrets
  namespace: devshop
spec:
  provider: aws

  parameters:
    objects: |
      - objectName: "devshop/devshop"
        objectType: "secretsmanager"
        jmesPath:
          - path: JWT_SECRET_KEY
            objectAlias: JWT_SECRET_KEY
          - path: DB_PASSWORD
            objectAlias: DB_PASSWORD
          - path: DATABASE_URL
            objectAlias: DATABASE_URL

  secretObjects:
    - secretName: devshop-secret
      type: Opaque
      data:
        - objectName: JWT_SECRET_KEY
          key: JWT_SECRET_KEY
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: DATABASE_URL
          key: DATABASE_URL