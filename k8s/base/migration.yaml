apiVersion: batch/v1
kind: Job
metadata:
  name: devshop-migration
  namespace: devshop
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  backoffLimit: 4

  template:
    metadata:
      labels:
        app: devshop-migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: sjd16/devshop:94010f6

          command:
            - python
            - -c
            - |
              import socket
              import time

              host = "devshop-postgres"
              port = 5432

              print(f"Waiting for PostgreSQL at {host}:{port}...")

              while True:
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          print("PostgreSQL is accepting TCP connections.")
                          break
                  except (ConnectionRefusedError, TimeoutError, OSError):
                      print("PostgreSQL not ready yet. Retrying...")
                      time.sleep(2)

              print("Running Alembic migrations...")

              import subprocess
              raise SystemExit(
                  subprocess.call(["alembic", "upgrade", "head"])
              )

          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devshop-config
                  key: DATABASE_URL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
