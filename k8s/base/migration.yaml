apiVersion: batch/v1
kind: Job
metadata:
  name: devshop-migration
  namespace: devshop
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  backoffLimit: 4

  template:
    metadata:
      labels:
        app: devshop-migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: sjd16/devshop:94010f6

          command:
            - alembic
            - upgrade
            - head

          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://devshop:devshop_dev_password@devshop-postgres:5432/devshop_test

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devshop-secret
                  key: JWT_SECRET_KEY
